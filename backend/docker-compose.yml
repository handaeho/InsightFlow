# docker-compose.yml (backend)

services:
  # 1. RDBMS
  mariadb:
    image: mariadb:10.11
    container_name: insightflow-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD} # .env 참조
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"  # Local:Container (3307로 우회)
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - insightflow-net

  # 2. MongoDB
  mongodb:
    image: mongo:6.0
    container_name: insightflow-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: gaion
      MONGO_INITDB_ROOT_PASSWORD: gaion3413
    ports:
      - "27018:27017" # Local:Container (27018로 우회)
    volumes:
      - mongodb_data:/data/db
    networks:
      - insightflow-net

  # 3. Redis(Cache & Auth)
  redis:
    image: redis:7.0-alpine
    container_name: insightflow-redis
    # 환경 변수를 사용하여 커맨드 구성
    command: redis-server --requirepass ${REDIS_PASSWORD} 
    ports:
      - "6380:6379" # Local:Container (6380으로 우회)
    networks:
      - insightflow-net

  # 4. MinIO(Object Storage (파일 저장소))
  minio:
    image: minio/minio
    container_name: insightflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"  # API Port
      - "9001:9001"  # Console UI Port
    volumes:
      - minio_data:/data
    networks:
      - insightflow-net

networks:
  insightflow-net:
    driver: bridge

volumes:
  mariadb_data:
  mongodb_data:
  minio_data: